# /etc/opendkim.conf en mail.familia.internal — VERIFICA las firmas de los correos que llegan
Syslog                  yes
UMask                   007
Mode                    v
AuthservID              mail.familia.internal
Socket                  inet:8891@localhost
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim
AlwaysAddARHeader       yes
Nameservers             10.10.10.4

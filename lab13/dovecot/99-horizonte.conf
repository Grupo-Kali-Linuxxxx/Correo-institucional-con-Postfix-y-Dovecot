# /etc/dovecot/conf.d/99-horizonte.conf — IMAP seguro para los buzones Maildir que llena Postfix
protocols = imap
# Saludo sin revelar el sistema (por defecto dice "Dovecot (Ubuntu) ready.")
login_greeting = Correo listo.
mail_location = maildir:~/Maildir

# TLS obligatorio con el certificado de la CA de correo; nada de contraseñas en claro
ssl = required
ssl_cert = </etc/dovecot/private/mail.crt
ssl_key = </etc/dovecot/private/mail.key
ssl_min_protocol = TLSv1.2
disable_plaintext_auth = yes
auth_mechanisms = plain login

# Solo IMAPS (993): el puerto 143 sin cifrar queda cerrado
service imap-login {
  inet_listener imap {
    port = 0
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Postfix pregunta a Dovecot si usuario y contraseña son correctos (SASL) para el envío por el puerto 587
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

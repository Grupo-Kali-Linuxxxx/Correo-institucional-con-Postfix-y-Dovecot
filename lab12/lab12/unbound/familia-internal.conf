# /etc/unbound/unbound.conf.d/familia-internal.conf — Simula el DNS de OTRO dominio de "internet": familia.internal
# (en la vida real, estos registros los publicaría el proveedor de esa familia/empresa)
server:
    local-zone: "familia.internal." static
    local-data: "familia.internal. 300 IN MX 10 mail.familia.internal."
    local-data: "mail.familia.internal. 300 IN A 10.10.10.26"
    local-data: "familia.internal. 300 IN TXT \"v=spf1 mx -all\""
    local-data-ptr: "10.10.10.26 mail.familia.internal."
